<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Graph Visualizer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400&display=swap');

    :root {
      --bg:        #0a0c0f;
      --panel:     #0f1217;
      --border:    #1e2530;
      --accent:    #00e5ff;
      --accent2:   #ff6b35;
      --node-leaf: #4a9eff;
      --node-clique: #00e5ff;
      --edge:      #1e3a4a;
      --edge-boundary: #ff6b3544;
      --text:      #8899aa;
      --text-hi:   #ccd6e0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      font-family: 'IBM Plex Mono', monospace;
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
    }

    #status {
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text);
    }

    #status span {
      color: var(--text-hi);
    }

    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    #cy {
      flex: 1;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 20% 20%, #00e5ff08 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, #ff6b3508 0%, transparent 50%);
    }

    aside {
      width: 240px;
      border-left: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    .panel-section {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .panel-label {
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 10px;
    }

    #detail-content {
      font-size: 11px;
      line-height: 1.8;
      color: var(--text);
    }

    #detail-content .row {
      display: flex;
      justify-content: space-between;
    }

    #detail-content .val {
      color: var(--text-hi);
    }

    #detail-content .clique-badge {
      display: inline-block;
      padding: 2px 8px;
      background: #00e5ff18;
      border: 1px solid #00e5ff44;
      color: var(--accent);
      font-size: 10px;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .legend {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      letter-spacing: 0.05em;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-dot.clique {
      background: var(--node-clique);
      box-shadow: 0 0 6px var(--node-clique);
    }

    .legend-dot.leaf {
      background: var(--node-leaf);
    }

    .legend-line {
      width: 18px;
      height: 2px;
      flex-shrink: 0;
    }

    .legend-line.internal { background: #2a4a5a; }
    .legend-line.boundary { background: var(--accent2); opacity: 0.6; }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      z-index: 100;
      flex-direction: column;
      gap: 12px;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #error-bar {
      display: none;
      padding: 8px 20px;
      background: #ff6b3522;
      border-bottom: 1px solid #ff6b3555;
      font-size: 10px;
      color: var(--accent2);
      letter-spacing: 0.1em;
      flex-shrink: 0;
    }

    button.fit-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      cursor: pointer;
      width: 100%;
      transition: border-color 0.15s, color 0.15s;
    }

    button.fit-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* expanding indicator on clique nodes */
    #cy .expanding {
      opacity: 0.4;
    }

    #expand-toast {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f1217ee;
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 6px 16px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 10;
    }

    #expand-toast.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  fetching graph
</div>

<div id="error-bar"></div>

<header>
  <h1>Graph Visualizer</h1>
  <div id="status">nodes: <span id="stat-nodes">—</span> &nbsp; edges: <span id="stat-edges">—</span></div>
</header>

<main>
  <div id="cy">
    <div id="expand-toast">expanding…</div>
  </div>

  <aside>
    <div class="panel-section">
      <div class="panel-label">Selected</div>
      <div id="detail-content" style="color: var(--text); font-size:10px;">
        click a node
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-label">Legend</div>
      <div class="legend">
        <div class="legend-item">
          <div class="legend-dot clique"></div>
          clique node
        </div>
        <div class="legend-item">
          <div class="legend-dot leaf"></div>
          leaf node
        </div>
        <div class="legend-item">
          <div class="legend-line internal"></div>
          internal edge
        </div>
        <div class="legend-item">
          <div class="legend-line boundary"></div>
          boundary edge
        </div>
      </div>
    </div>

    <div class="panel-section">
      <button class="fit-btn" onclick="cy.fit(undefined, 40)">fit to screen</button>
    </div>
  </aside>
</main>

<script>
  const API = 'http://localhost:8000';

  let cy;
  let expanding = false;  // lock to prevent double-clicks mid-fetch

  // --- Helpers ---

  function showError(msg) {
    const bar = document.getElementById('error-bar');
    bar.textContent = msg;
    bar.style.display = 'block';
  }

  function showToast(msg) {
    const t = document.getElementById('expand-toast');
    t.textContent = msg;
    t.classList.add('visible');
    setTimeout(() => t.classList.remove('visible'), 1200);
  }

  function updateStats() {
    document.getElementById('stat-nodes').textContent = cy.nodes().length;
    document.getElementById('stat-edges').textContent = cy.edges().length;
  }

  function buildElements(data) {
    const nodes = data.nodes.map(n => ({
      data: {
        id: n.id,
        label: n.label || n.id,
        x: n.x,
        y: n.y,
        is_clique: n.is_clique,
        clique_type: n.clique_type,
        member_count: n.member_count,
      },
      position: { x: n.x * 1000, y: n.y * 1000 }
    }));

    const edges = data.edges.map(e => ({
      data: {
        id: `${e.source_id}__${e.target_id}`,
        source: e.source_id,
        target: e.target_id,
        weight: e.weight,
        is_boundary: e.is_boundary,
      }
    }));

    return [...nodes, ...edges];
  }

  // --- Expand a clique node in-place ---

  async function expandClique(cliqueNode) {
    if (expanding) return;
    expanding = true;

    const cliqueId = cliqueNode.id();
    const cliquePos = cliqueNode.position();

    // Dim the node while loading
    cliqueNode.addClass('expanding');
    showToast('expanding…');

    try {
      const res = await fetch(`${API}/graph/expand/${encodeURIComponent(cliqueId)}`);
      if (!res.ok) throw new Error(`expand returned ${res.status}`);
      const data = await res.json();

      // Collect edges incident on the clique node that go to OTHER nodes
      // (not members — those will be replaced by internal edges)
      const memberIds = new Set(data.nodes.map(n => n.id));
      const externalEdges = [];

      cliqueNode.connectedEdges().forEach(e => {
        const srcId = e.data('source');
        const tgtId = e.data('target');
        const otherId = srcId === cliqueId ? tgtId : srcId;
        if (!memberIds.has(otherId)) {
          externalEdges.push({
            otherId,
            weight: e.data('weight'),
            is_boundary: e.data('is_boundary'),
          });
        }
      });

      // Remove the clique node (also removes all its edges in cytoscape)
      cy.remove(cliqueNode);

      // Add the child nodes
      const newNodeEls = data.nodes
        .filter(n => !cy.getElementById(n.id).length)  // skip if already on canvas
        .map(n => ({
          data: {
            id: n.id,
            label: n.label || n.id,
            x: n.x,
            y: n.y,
            is_clique: n.is_clique,
            clique_type: n.clique_type,
            member_count: n.member_count,
          },
          position: { x: n.x * 1000, y: n.y * 1000 }
        }));

      cy.add(newNodeEls);

      // Add internal edges between members
      const internalEdgeEls = data.edges
        .filter(e => !e.is_boundary)
        .filter(e => !cy.getElementById(`${e.source_id}__${e.target_id}`).length)
        .map(e => ({
          data: {
            id: `${e.source_id}__${e.target_id}`,
            source: e.source_id,
            target: e.target_id,
            weight: e.weight,
            is_boundary: false,
          }
        }));

      cy.add(internalEdgeEls);

      // Rewire boundary edges — the API returns which member owns each out-edge.
      // Also restore any external edges that were connected to the old clique node.
      const boundaryEdgeEls = data.edges
        .filter(e => e.is_boundary)
        .filter(e => cy.getElementById(e.target_id).length)  // target must be on canvas
        .filter(e => !cy.getElementById(`${e.source_id}__${e.target_id}`).length)
        .map(e => ({
          data: {
            id: `${e.source_id}__${e.target_id}`,
            source: e.source_id,
            target: e.target_id,
            weight: e.weight,
            is_boundary: true,
          }
        }));

      cy.add(boundaryEdgeEls);

      // Fallback: for any external edge we found on the old clique node that the
      // API didn't rewire, connect it to the centroid-nearest member
      externalEdges.forEach(({ otherId, weight, is_boundary }) => {
        const otherNode = cy.getElementById(otherId);
        if (!otherNode.length) return;

        const otherPos = otherNode.position();

        // Find closest member to the external node
        let closest = null;
        let closestDist = Infinity;
        data.nodes.forEach(n => {
          const nEl = cy.getElementById(n.id);
          if (!nEl.length) return;
          const p = nEl.position();
          const d = Math.hypot(p.x - otherPos.x, p.y - otherPos.y);
          if (d < closestDist) { closestDist = d; closest = n.id; }
        });

        if (!closest) return;

        const edgeId = `${closest}__${otherId}`;
        const edgeIdRev = `${otherId}__${closest}`;
        if (cy.getElementById(edgeId).length || cy.getElementById(edgeIdRev).length) return;

        cy.add({ data: { id: edgeId, source: closest, target: otherId, weight, is_boundary } });
      });

      updateStats();
      showToast(`+${data.nodes.length} nodes`);

    } catch (err) {
      showError(`expand failed: ${err.message}`);
      // Restore the clique node if something went wrong
      cliqueNode.removeClass('expanding');
    } finally {
      expanding = false;
    }
  }

  // --- Fetch & init ---

  async function loadTop() {
    const res = await fetch(`${API}/graph/top`);
    if (!res.ok) throw new Error(`/graph/top returned ${res.status}`);
    return res.json();
  }

  function renderDetail(node) {
    const n = node.data();
    const detail = document.getElementById('detail-content');

    if (n.is_clique) {
      detail.innerHTML = `
        <div class="clique-badge">${n.clique_type || 'CLIQUE'}</div>
        <div class="row"><span>id</span><span class="val">${n.id.slice(0, 18)}</span></div>
        <div class="row"><span>members</span><span class="val">${n.member_count ?? '—'}</span></div>
        <div class="row"><span>x</span><span class="val">${Number(n.x).toFixed(4)}</span></div>
        <div class="row"><span>y</span><span class="val">${Number(n.y).toFixed(4)}</span></div>
        <div class="row"><span>degree</span><span class="val">${node.degree()}</span></div>
        <div style="margin-top:8px; font-size:9px; color: var(--accent); letter-spacing:0.1em;">
          ▸ click to expand
        </div>
      `;
    } else {
      detail.innerHTML = `
        <div class="row"><span>id</span><span class="val">${n.id.slice(0, 18)}</span></div>
        <div class="row"><span>label</span><span class="val">${(n.label || '—').slice(0, 16)}</span></div>
        <div class="row"><span>x</span><span class="val">${Number(n.x).toFixed(4)}</span></div>
        <div class="row"><span>y</span><span class="val">${Number(n.y).toFixed(4)}</span></div>
        <div class="row"><span>degree</span><span class="val">${node.degree()}</span></div>
      `;
    }
  }

  function initCytoscape(elements) {
    cy = cytoscape({
      container: document.getElementById('cy'),
      elements,
      layout: { name: 'preset' },

      style: [
        {
          selector: 'node',
          style: {
            'width': 10,
            'height': 10,
            'background-color': '#4a9eff',
            'border-width': 0,
            'label': '',
            'transition-property': 'background-color, border-color, width, height, opacity',
            'transition-duration': '150ms',
            'cursor': 'default',
          }
        },
        {
          selector: 'node[?is_clique]',
          style: {
            'width': 'mapData(member_count, 3, 10, 14, 26)',
            'height': 'mapData(member_count, 3, 10, 14, 26)',
            'background-color': '#00e5ff',
            'border-width': 1.5,
            'border-color': '#00e5ff66',
            'shadow-blur': 8,
            'shadow-color': '#00e5ff',
            'shadow-opacity': 0.6,
            'shadow-offset-x': 0,
            'shadow-offset-y': 0,
            'cursor': 'pointer',
          }
        },
        {
          selector: 'node.expanding',
          style: {
            'opacity': 0.3,
          }
        },
        {
          selector: 'node:selected',
          style: {
            'border-width': 2,
            'border-color': '#ffffff',
            'background-color': '#ffffff',
          }
        },
        {
          selector: 'node:hover',
          style: {
            'border-width': 1.5,
            'border-color': '#ffffff88',
          }
        },
        {
          selector: 'edge',
          style: {
            'width': 'mapData(weight, 0, 5, 0.4, 2)',
            'line-color': '#1e3a4a',
            'opacity': 0.7,
            'curve-style': 'straight',
          }
        },
        {
          selector: 'edge[?is_boundary]',
          style: {
            'line-color': '#ff6b35',
            'opacity': 0.35,
            'line-style': 'dashed',
            'line-dash-pattern': [4, 4],
          }
        },
      ],

      wheelSensitivity: 0.3,
      minZoom: 0.01,
      maxZoom: 20,
    });

    updateStats();

    // Single click: show detail panel
    cy.on('tap', 'node', function(evt) {
      renderDetail(evt.target);
    });

    // Double-click on clique: expand
    cy.on('dblclick tap', 'node[?is_clique]', function(evt) {
      evt.stopPropagation();
      expandClique(evt.target);
    });

    // Background tap: clear panel
    cy.on('tap', function(evt) {
      if (evt.target === cy) {
        document.getElementById('detail-content').textContent = 'click a node';
      }
    });
  }

  // --- Boot ---
  (async () => {
    try {
      const data = await loadTop();
      const elements = buildElements(data);
      initCytoscape(elements);
      document.getElementById('loading').style.display = 'none';
    } catch (err) {
      document.getElementById('loading').style.display = 'none';
      showError(`failed to load: ${err.message}`);
    }
  })();
</script>
</body>
</html>
